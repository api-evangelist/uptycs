aid: uptycs
name: Uptycs
description: >-
  Uptycs is a unified cloud-native application protection platform (CNAPP) and
  extended detection and response (XDR) company. Built on osquery — which its
  founders helped commercialize at scale — the Uptycs platform streams
  structured telemetry from endpoints, cloud workloads, containers, and
  Kubernetes into a SQL-queryable security data lake, powering CSPM, CWPP,
  CIEM, vulnerability management, compliance, threat hunting, and detection
  and response from a single console. Each customer runs on a dedicated stack
  ({stack}.uptycs.io) whose JSON REST API covers alerts, events, assets,
  ad-hoc SQL queries, threat intelligence, lookup tables, and users. Uptycs is
  backed by investors including Norwest Venture Partners and Sapphire
  Ventures and maintains active SOC 2 Type II compliance.
